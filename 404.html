<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex" />
    <title>404 — Pagina non trovata · Federico Del Pup</title>
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <style>
      .nf {
        min-height: 100svh;
        display: grid;
        place-items: center;
        text-align: center;
        position: relative;
        overflow: hidden;
        padding: 24px;
      }
      .nf__bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image: linear-gradient(var(--border) 1px, transparent 1px),
          linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, #000 10%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, #000 10%, transparent 75%);
        opacity: 0.5;
      }
      .nf__inner {
        position: relative;
        z-index: 1;
      }
      .nf__code {
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: clamp(6rem, 24vw, 16rem);
        line-height: 0.9;
        letter-spacing: -0.04em;
        background: linear-gradient(135deg, var(--text) 0%, var(--text-faint) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        position: relative;
        animation: nf-in var(--t-slow) var(--ease) both;
      }
      .nf__code::before,
      .nf__code::after {
        content: "404";
        position: absolute;
        inset: 0;
        background: inherit;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        opacity: 0;
      }
      .nf__code::before {
        animation: glitch 3.4s steps(2, end) infinite;
        text-shadow: 2px 0 var(--accent-glow);
      }
      .nf__code::after {
        animation: glitch 3.4s steps(2, end) infinite reverse;
      }
      @keyframes glitch {
        0%, 92%, 100% { opacity: 0; transform: translate(0, 0); }
        93% { opacity: 0.7; transform: translate(-3px, 1px); }
        96% { opacity: 0.7; transform: translate(3px, -1px); }
      }
      .nf__title {
        font-size: clamp(1.4rem, 4vw, 2rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-top: 8px;
        animation: nf-in var(--t-slow) var(--ease) 80ms both;
      }
      .nf__sub {
        color: var(--text-muted);
        margin: 14px auto 36px;
        max-width: 440px;
        animation: nf-in var(--t-slow) var(--ease) 160ms both;
      }
      .nf__cta {
        display: inline-flex;
        animation: nf-in var(--t-slow) var(--ease) 240ms both;
      }
      @keyframes nf-in {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .nf__code::before, .nf__code::after { animation: none; }
        .nf__code, .nf__title, .nf__sub, .nf__cta { animation: none; }
      }
    </style>
  </head>
  <body>
    <main class="nf">
      <div class="nf__bg" aria-hidden="true"></div>
      <div class="nf__inner container">
        <p class="nf__code" data-text="404">404</p>
        <h1 class="nf__title">Questa pagina si è persa.</h1>
        <p class="nf__sub">
          Il link è rotto o la pagina è stata spostata. Torniamo al sicuro.
        </p>
        <a href="/FedericoDelPup-portfolio/" class="btn btn--primary nf__cta">
          Torna alla home
          <svg viewBox="0 0 24 24" aria-hidden="true" class="btn__arrow">
            <path d="M5 12h14M13 5l7 7-7 7" />
          </svg>
        </a>
      </div>
    </main>
  </body>
</html>
